<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Social links profile</title>

</head>
<body>
<main>
  <div class="card">
  <div class="card-image-container">
  <img src="./assets/images/avatar-jessica.jpeg" alt="Profile image ofJessica Randall" class="profile-image">
  </div>
  <h1 class="username">Jessica Randall</h1>
  <h2 class="location">London, United Kingdom</h2>
  <p class="bio">"Front-end developer and avid reader."</p>
<div class="buttons">
  <button class="social-links">GitHub</button>
  <button class="social-links">Frontend Mentor</button>
  <button class="social-links">LinkedIn</button>
  <button class="social-links">Twitter</button>
  <button class="social-links">Instagram</button>
  </div>
</div>
  </main>

</html>
